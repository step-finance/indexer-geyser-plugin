[workspace]
members = ["crates/*"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.debug-lite]
inherits = "dev"
incremental = false
opt-level = 0
debug = 1
lto = "off"

[profile.release-lite]
inherits = "release"
opt-level = 2

[profile.debug-opt]
inherits = "release"
debug = 2
debug-assertions = true
incremental = true

[profile.docker]
inherits = "release"
# strip = "symbols" # Not supported in the workspace toolchain version

[patch.crates-io]
solana-transaction-status = { git = 'https://github.com/step-finance/agave', rev = "bb42401bd6336bfeecb5100c0afe96430f7a4ff5" }
solana-transaction-status-client-types = { git = 'https://github.com/step-finance/agave', rev = "bb42401bd6336bfeecb5100c0afe96430f7a4ff5" }
agave-geyser-plugin-interface = { git = 'https://github.com/step-finance/agave', rev = "bb42401bd6336bfeecb5100c0afe96430f7a4ff5" }
solana-metrics = { git = 'https://github.com/step-finance/agave', rev = "bb42401bd6336bfeecb5100c0afe96430f7a4ff5" }
solana-zk-token-sdk = { git = 'https://github.com/step-finance/agave', rev = "bb42401bd6336bfeecb5100c0afe96430f7a4ff5" }

